name: Bot turnos padel

on:
  schedule:
    - cron: "0 12 * * *"         # resumen diario: 12:00 UTC = 9:00 hora argentina
    - cron: "15,45 * * * *"      # alertas: cada 30 minutos (a los :15 y :45)
  workflow_dispatch:             # botón "Run workflow" para correrlo a mano
    inputs:
      modo:
        description: "Qué correr"
        type: choice
        options: [alertas, resumen]
        default: alertas

concurrency:
  group: bot-padel
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar turnos ya vistos
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Revisar ATC y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ (github.event.schedule == '0 12 * * *' || inputs.modo == 'resumen') && '--resumen' || '' }}
        run: python bot.py $MODO

      - name: Guardar turnos vistos
        if: always() && hashFiles('estado/vistos.json') != ''
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
